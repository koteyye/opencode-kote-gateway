name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and transport-contract tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Package smoke test
        run: bun run package:smoke

      - name: Create npm tarball
        run: npm pack --ignore-scripts

  integration:
    name: Integration and security audit (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run transport integration tests
        run: bun run test:integration

      - name: Audit imports and fixtures
        run: bun run audit

  compatibility:
    name: OpenCode public API (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: minimum
            plugin: 1.18.5
            opencode: 1.18.5
          - channel: ceiling
            plugin: 1.18.18
            opencode: 1.18.18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve public plugin API version
        run: bun add --no-save --dev "@opencode-ai/plugin@${{ matrix.plugin }}"

      - name: Check public hook types and package exports
        run: bun run typecheck && bun run build && bun run package:smoke

      - name: Resolve OpenCode CLI version
        run: bunx --bun "opencode-ai@${{ matrix.opencode }}" --version

      - name: Load packed plugin through OpenCode
        run: bun run scripts/opencode-smoke.ts "${{ matrix.opencode }}"
